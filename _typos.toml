# Repo-local typos config, layered under the gate's qgate.typos.toml. Only names this repo cannot rename.

[files]
extend-exclude = [
    # Unity TextMesh Pro package import (Unity Technologies), not our code.
    "unity/Assets/TextMesh Pro/",
]

[default.extend-identifiers]
# Vanilla sprite name matched at runtime (theme spriteRoles; same name in AugaStyle.cs:37 runtime dump).
BraidLineHorisontalMedium = "BraidLineHorisontalMedium"
# art/src/render_sprites.py (art worker): short math names, not words: iy = row index, dout = output directory.
iy = "iy"
dout = "dout"
# Vanilla field names (assembly_valheim Game.m_localDamgeTakenRate, SE_Stats.m_percentigeDamageModifiers).
m_localDamgeTakenRate = "m_localDamgeTakenRate"
m_percentigeDamageModifiers = "m_percentigeDamageModifiers"
# Vanilla field InventoryElement.m_equiped (assembly_valheim InventoryElement.cs:18), also named in art notes.
m_equiped = "m_equiped"
equiped = "equiped"
# Vanilla crafting panel child name InventoryGui.m_crafting/Decription (VNEI and RecipeChains find it by that path).
Decription = "Decription"
# Vanilla field InventoryGui.m_recipeDecription (assembly_valheim InventoryGui.cs:117).
m_recipeDecription = "m_recipeDecription"

# Vanilla class PlayerCustomizaton (assembly_valheim PlayerCustomizaton.cs, barber UI), named in docs/screen-inventory.md.
PlayerCustomizaton = "PlayerCustomizaton"
# BossAwakening world boss bar object name BA_WorldBossBar (AugaSkin exemption), named in docs/screen-inventory.md.
BA_WorldBossBar = "BA_WorldBossBar"
# Vanilla method StatusEffect.GetRemaningTime (assembly_valheim StatusEffect.cs:204), active effects page.
GetRemaningTime = "GetRemaningTime"
# Vanilla field Player.m_eiterRegen (assembly_valheim Player.cs:252), character stats eitr regen.
m_eiterRegen = "m_eiterRegen"
